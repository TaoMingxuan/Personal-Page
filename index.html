    // ============================================================


    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderLatestProjects() {
        const container = document.getElementById('latest-projects');
        container.innerHTML = latestProjectsData.map(project => `
            <a href="${project.link}" class="work-card-link">
                <div class="work-card">
                    <img src="${project.thumbnail}" alt="${escapeHtml(project.title)}" onerror="this.src='https://picsum.photos/640/360?random=1'">
                    <div class="work-info">
                        <h3>${escapeHtml(project.title)}</h3>
                        <div class="tags">
                            ${project.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                        </div>
                        <p>${escapeHtml(project.desc)}</p>
                    </div>
                </div>
            </a>
        `).join('');
    }

    // 初始渲染最新项目
    renderLatestProjects();
</script>
