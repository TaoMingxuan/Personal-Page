    <section class="games-overview" aria-label="项目概览">

        <div><strong>04</strong><span>可试玩项目</span></div>
        <div><strong>01</strong><span>进行中</span></div>
    </section>

    <div class="games-toolbar">
        <p><span>INDEX / 01</span> 按项目查看玩法、关卡与系统实践</p>
        <div class="view-toggle">
            <button class="view-btn active" data-view="card">卡片模式</button>
            <button class="view-btn" data-view="list">列表模式</button>
        </div>
    </div>

    <div id="games-container"></div>
</div>

<script>
    // ============================================================
    // 👇👇👇 在这里手动填写你的游戏数据 👇👇👇
    // ============================================================
    const gamesData = [
        {
            title: "超市模拟器·模拟经营Demo(进行中)",
            status: "进行中",
            year: "2026",
            format: "合作项目",
            tags: ["合作项目","玩法设计","模拟经营","多人合作"],
            desc: "一款开超市的模拟经营游戏。玩家需要进货并合理定价这些商品，将它们出售给顾客从而获利。赚取的钱财可以用于招募NPC角色；解锁更多超市结构（扩建）；更多功能玩法（超市外送）等，从而达成循环升级的目的。",
            thumbnail: "Images/占位图.png",
            link: "games.html"
        },
        {
            title: "符影双生·合作解谜Demo",
            status: "可试玩",
            year: "2026",
            format: "个人项目",
            tags: ["个人项目","关卡设计","玩法设计","合作解谜","双人同屏"],
            desc: "一款中式题材的双人合作解谜游戏，两位玩家需要分别控制阴阳两种力量。",
            thumbnail: "Games/符影双生/符影双生效果图.png",
            link: "Games/符影双生/202604_符影双生.html"
        },
        {
            title: "R00T.5·蒸汽朋克节奏探索Demo",
            status: "已完成",
            year: "2023",
            format: "Game Jam",
            tags: ["节奏探索","蒸汽朋克","Game Jam"],
            desc: "Global Game Jam 2023 72小时4人团队节奏探索游戏，操控采矿机器人跟随节拍挖掘地下收集种子。",
            thumbnail: "Games/R00T.5/Cover.png",
            link: "Games/R00T.5/202302_R00T.5.html"
        },
        {
            title: "Laugh Lift·休闲点击Demo",
            status: "已完成",
            year: "2024",
            format: "Game Jam",
            tags: ["休闲点击", "UE4蓝图", "快速原型", "范围管理"],
            desc: "Global Game Jam 2024 72小时4人团队休闲点击游戏，通过精准点击让角色不断上升，并用笑声强化主题体验。",
            thumbnail: "Images/占位图.png",
            link: "Games/LaughLift/202401_LaughLift.html"
        },
        {
            title: "秘密入侵·技能FPSDemo",
            status: "可试玩",
            year: "2026",
            format: "个人项目",
            tags: ["个人项目","任务设计","技能设计","FPS"],
            desc: "一款第一人称潜入与战术射击结合的单人游戏。玩家将潜入敌方的实验基地，获取相关情报，并摧毁相关设施。",
            thumbnail: "Games/秘密入侵/秘密入侵.png",
            link: "Games/秘密入侵/202602_秘密入侵.html"
        }
    ];
    // ============================================================

    let currentView = 'card';

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderCardMode() {
        const container = document.getElementById('games-container');
        container.className = 'work-grid';
        container.innerHTML = gamesData.map((game, index) => `
            <a href="${game.link}" class="work-card-link">
                <div class="work-card">
                <img src="${game.thumbnail}" alt="${escapeHtml(game.title)}">
                    <div class="work-info">
                        <div class="work-card__meta"><span>${String(index + 1).padStart(2, '0')}</span><span>${escapeHtml(game.year)} · ${escapeHtml(game.format)}</span><b>${escapeHtml(game.status)}</b></div>
                        <h3>${escapeHtml(game.title)}</h3>
                        <div class="tags">
                            ${game.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                        </div>
                        <p>${escapeHtml(game.desc)}</p>
                    </div>
                </div>
            </a>
        `).join('');
    }

    function renderListMode() {
        const container = document.getElementById('games-container');
        container.className = 'list-view';
        container.innerHTML = gamesData.map((game, index) => `
            <a href="${game.link}" class="list-item">
                <div class="list-item-thumb">
                <img src="${game.thumbnail}" alt="${escapeHtml(game.title)}">
                </div>
                <div class="list-item-info">
                    <div class="list-item__meta"><span>${String(index + 1).padStart(2, '0')}</span><span>${escapeHtml(game.year)} · ${escapeHtml(game.format)}</span><b>${escapeHtml(game.status)}</b></div>
                    <h3>${escapeHtml(game.title)}</h3>
                    <div class="tags">
                        ${game.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                    </div>
                    <p>${escapeHtml(game.desc)}</p>
                </div>
            </a>
        `).join('');
    }

    function renderCurrentView() {
        if (currentView === 'card') {
            renderCardMode();
        } else {
            renderListMode();
        }
    }

    function switchView(view) {
        currentView = view;
        renderCurrentView();
        document.querySelectorAll('.view-btn').forEach(btn => {
            const btnView = btn.getAttribute('data-view');
            if (btnView === view) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            switchView(btn.getAttribute('data-view'));
        });
    });

    // 初始渲染
    renderCardMode();
</script>
</body>
</html>
